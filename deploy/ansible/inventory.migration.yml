###############################################################################
# Migrations-Inventar — ProuDig Server-Umzug (alt -> neu)
#
# Zwei Gruppen:
#   source  = aktueller (alter) Produktions-Server  -> Export + Transfer
#   target  = neuer Server                           -> Import + Verifikation
#
# Anpassen: ansible_host (IP), ansible_user, SSH-Key je Host.
#
# WICHTIG (direkter Transfer source->target): Der alte Server muss den neuen
# per SSH erreichen (Agent-Forwarding). Vorher BEIDE Keys in den Agent laden —
# instance1.pem (alt) UND den Key des NEUEN Servers:
#   ssh-add ~/.ssh/instance1.pem ~/.ssh/KeyPairProudigHomePage.pem
# ForwardAgent-Flag als JSON an '-e' übergeben. NICHT
# "-e ansible_ssh_extra_args='-o ForwardAgent=yes'" — den Wert mit Leerzeichen
# zerlegt Ansible am Space -> ssh-Fehler 'no argument after keyword "-o"':
#   ansible-playbook -i inventory.migration.yml migrate.yml --tags transfer \
#     -e '{"ansible_ssh_extra_args":"-o ForwardAgent=yes"}'
###############################################################################

migration:
  children:
    source:
      hosts:
        proudig-old:
          ansible_host: 217.154.13.179       # <-- alte Server-IP
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/instance1.pem
          ansible_python_interpreter: /usr/bin/python3
    target:
      hosts:
        proudig-new:
          ansible_host: 80.158.61.13        # <-- neue Server-IP
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/KeyPairProudigHomePage.pem
          ansible_python_interpreter: /usr/bin/python3
