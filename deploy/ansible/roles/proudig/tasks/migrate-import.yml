---
###############################################################################
# IMPORT (Ziel-Server) — stellt DB + Dateien aus dem übertragenen Bundle her
# und deployt die App (rendert .env aus dem Vault -> DB-Passwort-Parität).
#
# Erwartet das Bundle unter {{ migration_dir }}/incoming/ (Transfer-Schritt).
# Setzt voraus: --tags setup lief bereits (Docker installiert).
###############################################################################

- name: Bundle-Verzeichnis
  set_fact:
    incoming_dir: "{{ migration_dir }}/incoming"

- name: MANIFEST vorhanden
  stat:
    path: "{{ incoming_dir }}/MANIFEST"
  register: manifest_stat

- name: Abbruch — kein MANIFEST (Transfer nicht gelaufen?)
  fail:
    msg: "Kein Bundle unter {{ incoming_dir }}. Erst --tags export,transfer ausführen."
  when: not manifest_stat.stat.exists

- name: MANIFEST — erwartete Code-Version lesen
  shell: grep '^source_git=' {{ incoming_dir }}/MANIFEST | cut -d= -f2
  register: manifest_git
  changed_when: false

# ── Versions-Gleichstand (kein Liquibase-Re-Run) ──
- name: Aktuelle Code-Version des Deploy-Checkouts lesen (Kontroll-Node)
  shell: git -C "{{ project_src }}" rev-parse HEAD
  delegate_to: localhost
  become: false
  register: current_git
  changed_when: false

- name: Abbruch bei Versions-Abweichung
  fail:
    msg: >
      Deploy-Checkout ({{ current_git.stdout }}) weicht von der Bundle-Version
      ({{ manifest_git.stdout }}) ab. Gleichen Commit auschecken oder
      -e force_import=true setzen (Liquibase-Re-Run möglich).
  when:
    - current_git.stdout != manifest_git.stdout
    - not (force_import | bool)

# ── Ziel-DB muss frisch sein ──
- name: Vorhandenes proudig-pgdata-Volume prüfen
  shell: docker volume inspect proudig-pgdata >/dev/null 2>&1 && echo "exists" || echo "absent"
  register: pgvol
  changed_when: false

- name: Abbruch bei bereits belegtem Ziel-Volume
  fail:
    msg: >
      proudig-pgdata existiert bereits auf dem Ziel-Server. Für einen sauberen
      Restore ein frisches Volume verwenden ('docker volume rm proudig-pgdata'
      nach 'docker compose down') oder -e force_import=true setzen.
  when:
    - pgvol.stdout == "exists"
    - not (force_import | bool)

# ── Verzeichnisse + Projekt + .env ──
- name: App-Verzeichnisse anlegen
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/data/files"

- name: Projekt-Dateien synchronisieren
  synchronize:
    src: "{{ project_src }}/"
    dest: "{{ app_dir }}/"
    delete: no
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=.git"
      - "--exclude=target"
      - "--exclude=*.class"
      - "--exclude=.idea"
      - "--exclude=.vscode"

- name: Environment-Datei (.env) aus Vault rendern
  template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
    force: yes

# ── DB restaurieren (nur db starten, dann einspielen) ──
- name: Nur proudig-db starten
  shell: |
    cd {{ app_dir }}
    docker compose --env-file .env up -d proudig-db
  become_user: "{{ ansible_user }}"

- name: Warten bis proudig-db bereit ist (max 2 Min)
  shell: |
    for i in $(seq 1 24); do
      if docker exec proudig-db pg_isready -U {{ db_user }} -d {{ db_name }} >/dev/null 2>&1; then
        echo "ready after ${i}x5s"; exit 0
      fi
      sleep 5
    done
    echo "TIMEOUT"; exit 1
  become_user: "{{ ansible_user }}"
  register: db_ready
  changed_when: false

- name: Datenbank einspielen (db.sql -> proudigdb)
  shell: >
    cat {{ incoming_dir }}/db.sql
    | docker exec -i proudig-db psql -U {{ db_user }} -d {{ db_name }}
    -v ON_ERROR_STOP=1 -q
  become_user: "{{ ansible_user }}"
  register: restore_result
  changed_when: true

# ── Dateien wiederherstellen ──
- name: Uploads entpacken (files.tgz -> data/)
  shell: >
    tar xzf {{ incoming_dir }}/files.tgz -C {{ app_dir }}/data
  args:
    creates: "{{ app_dir }}/data/files"

- name: Eigentümer/Rechte der Uploads setzen
  file:
    path: "{{ app_dir }}/data/files"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: yes

# ── App bauen + starten ──
- name: Docker-Image bauen
  shell: |
    cd {{ app_dir }}
    docker compose build --no-cache proudig-app
  become_user: "{{ ansible_user }}"

- name: Alle Container starten
  shell: |
    cd {{ app_dir }}
    docker compose --env-file .env up -d --remove-orphans
  become_user: "{{ ansible_user }}"

- name: Warten bis Anwendung healthy ist (max 5 Min)
  shell: |
    for i in $(seq 1 30); do
      STATUS=$(docker inspect --format='{{ '{{' }}.State.Health.Status{{ '}}' }}' proudig-app 2>/dev/null || echo "starting")
      if [ "$STATUS" = "healthy" ]; then echo "healthy after ${i}0s"; exit 0; fi
      sleep 10
    done
    echo "TIMEOUT"; docker logs proudig-app --tail 50; exit 1
  become_user: "{{ ansible_user }}"
  register: import_health
  changed_when: false

- name: Import-Zusammenfassung
  debug:
    msg:
      - "DB restauriert, Dateien entpackt, App deployt (Version {{ manifest_git.stdout }})."
      - "Nächster Schritt: --tags verify"
